<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href="Style.css"/>
    <title>Assignment on HTML forms</title>
</head>
<body>
    <h1 class = "Main">The Ultimate Form</h1>
    <form>
    <div id = "content">
        <div id = "child">...</div>
        <h1 class = "Main">Application Form</h1>
        <p>Student internship application . * required</p>
        <h2 class = "clues">Personal Details /fieldset+legend</h2>
        <label for = "name">Full name*</label>
      <input type = "text" placeholder="Harshit" id = "name" class = "form" required required/>
      <label for = "Email">Email*</label>
      <input type = "email" placeholder="Example@gmail.com" id = "Email" class = "form" required> 
      <label for = "Password">Password*</label>
      <input type = "password" id = "Password" placeholder="******" class = "form">
      <label for = "phoneNumber">Phone*</label>
      <input type = "tel" id = "phoneNumber" placeholder="9999999999" class = "form" required>
      <label for = "link">Portfolio URL</label>
      <input type = "url" id = "link" placeholder = "https://example.com" class = "form">
      <label for = "age">Age*</label>
      <input type = "number"  id = "age" placeholder="XYZ" class = "form" required>
      <p>Gender:</p>
      <input type = "radio" id = "male" name = "gender" value = "male">
      <label class = "hadio" for = "male">Male</label>
      <input type = "radio" id = "female" name = "gender" value = "female">
      <label class = "hadio" for = "female">Female</label>
      <input type = "radio" id = "others" name = "gender" value = "others">
      <label class = "hadio" for = "others">other/perfect not to say</label>
      <h2 class = "clues">Education / fieldset+legend</h2>
      <label for = "course">Course*</label>
      <input type = "text" id = "course" placeholder="BTECH(CSE)" class = "form" required>
      <label>Preferred city (datalist)</label>
      <select class = "form">
        <option>City</option>
        <option>Delhi</option>
        <option>Mumbai</option>
        <option>Gujrat</option>
        <option>Bareilly</option>
        <option>Other</option>
      </select>
      <p>Skills:</p>
      <input type = "checkbox" value = "HTML" id="Html" class="hadio ">
      <label class = "hadio"for="Html">HTML</label>
      <input type="checkbox" value = "CSS" id = "Css" class="hadio ">
      <label class = "hadio"for="Css">CSS</label>
       <input type="checkbox" value = "javaScript" id = "javaScript" class="hadio ">
      <label class = "hadio"for="javaScript">javaScript</label>
      <h2 class = "clues">Upload & Extras / fieldset + legend</h2>
      <label for = "available">Available form</label>
      <input type = "date" id = "available" class = "form">
      <label for = "InterviewTime">Interview time</label>
      <input type = "time" id = "InterviewTime" class = "form">
      <label for="resume">Resume</label>
      <input type="url" id = "resume" class="form" placeholder="https://resume.com">
      <p>Expected monthly stipend : 10,000</p>
      <div style="border: 2px solid rgb(1, 53, 1); border-radius: 10px;"></div> 
      <label for="feedback">Why would you like to join?</label>
      <textarea id="feedback" class="form" placeholder="Type here" rows="5"></textarea>
      <input type="submit" style="background-color: rgb(2, 49, 2); color: white; width: 40%;">
      <button style="background-color: rgb(2, 46, 2); color: white; width: 30% ;">Reset</button>
    </div>
    </form>
</body>
</name
